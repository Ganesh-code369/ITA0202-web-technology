<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock and Exam Countdown</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: blue;
        }

        #clock {
            font-size: 40px;
            font-weight: bold;
            margin: 20px;
        }

        #countdown {
            font-size: 30px;
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Digital Clock</h1>

        <div id="clock"></div>

        <hr>

        <h2>Examination Countdown</h2>

        <div id="countdown"></div>

    </div>

    <script>

        function updateClock() {

            let now = new Date();

            let time = now.toLocaleTimeString();

            document.getElementById("clock").innerHTML = time;
        }

        setInterval(updateClock, 1000);

        updateClock();


        // Set your examination date here
        let examDate = new Date("December 31, 2026 09:00:00").getTime();


        function updateCountdown() {

            let now = new Date().getTime();

            let difference = examDate - now;

            if (difference <= 0) {

                document.getElementById("countdown").innerHTML =
                    "Exam Started!";

                return;
            }

            let days = Math.floor(
                difference / (1000 * 60 * 60 * 24)
            );

            let hours = Math.floor(
                (difference % (1000 * 60 * 60 * 24)) /
                (1000 * 60 * 60)
            );

            let minutes = Math.floor(
                (difference % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            let seconds = Math.floor(
                (difference % (1000 * 60)) / 1000
            );

            document.getElementById("countdown").innerHTML =
                days + " Days " +
                hours + " Hours " +
                minutes + " Minutes " +
                seconds + " Seconds";
        }

        setInterval(updateCountdown, 1000);

        updateCountdown();

    </script>

</body>
</html>
