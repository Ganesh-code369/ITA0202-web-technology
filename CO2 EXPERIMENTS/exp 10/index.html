<!DOCTYPE html>
<html>
<head>
    <title>Debugging CSS and JavaScript</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: blue;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkblue;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Debugging Application</h1>

        <p>Click the button to test JavaScript.</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>

    <script>

        function showMessage() {

            try {

                document.getElementById("message").innerHTML =
                    "JavaScript is working successfully!";

                console.log("Button clicked successfully");

            }

            catch (error) {

                console.log("Error: " + error.message);

            }

        }

    </script>

</body>
</html>
