<!DOCTYPE html>
<html>
<head> 
    <title>Student Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .profile {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .profile img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
        }

        .details {
            flex: 1;
        }

        h1 {
            color: #007bff;
        }

        p {
            font-size: 18px;
        }

        .skills span {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
        }

        @media (max-width: 600px) {

            .profile {
                flex-direction: column;
                text-align: center;
                width: 90%;
            }

        }

    </style>
</head>

<body>

    <div class="profile">

        <img src="student.jpg" alt="Student Profile">

        <div class="details">

            <h1>Ganesh</h1>

            <p><b>Roll Number:</b> 123456</p>
            <p><b>Department:</b> Computer Science Engineering</p>
            <p><b>Year:</b> 2nd Year</p>
            <p><b>Email:</b> ganesh@example.com</p>

            <h3>Skills</h3>

            <div class="skills">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
            </div>

        </div>

    </div>

</body>
</html>
