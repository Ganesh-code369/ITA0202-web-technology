<!DOCTYPE html>
<html>
<head>
    <title>Cross-Browser Compatible Webpage</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        #message {
            font-size: 18px;
            margin-top: 20px;
        }

        /* CSS Feature Detection */

        @supports (display: grid) {

            .container {
                display: grid;
                gap: 15px;
            }

        }

        /* Fallback for browsers without CSS Grid */

        @supports not (display: grid) {

            .container {
                display: block;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Cross-Browser Compatible Webpage</h2>

        <p id="message">
            Checking browser feature support...
        </p>

        <button onclick="checkFeatures()">
            Check Browser Support
        </button>

    </div>


    <script>

        function checkFeatures() {

            let message =
                document.getElementById("message");

            let result = "";

            /* Check localStorage support */

            if (typeof(Storage) !== "undefined") {

                result +=
                    "localStorage: Supported<br>";

                localStorage.setItem(
                    "test",
                    "Browser Support Test"
                );

            } else {

                result +=
                    "localStorage: Not Supported<br>";

            }


            /* Check querySelector support */

            if (document.querySelector) {

                result +=
                    "querySelector(): Supported<br>";

            } else {

                result +=
                    "querySelector(): Not Supported<br>";

            }


            /* Fallback technique */

            if (!document.querySelector) {

                result +=
                    "Using getElementById() as fallback<br>";

            }


            message.innerHTML = result;

        }

    </script>

</body>
</html>
