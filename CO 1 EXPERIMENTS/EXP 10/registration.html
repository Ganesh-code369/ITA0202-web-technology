<header>

<nav>

<div class="container">

    <form>

        <label>Student Name</label>
        <input type="text" required>

        <br><br>

        <label>Email</label>
        <input type="email" required>

        <br><br>

        <label>Course</label>

        <select>
            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
        </select>

        <br><br>

        <label>Address</label>

        <textarea rows="5"></textarea>

        <br><br>

        <button type="submit">Register</button>

        <button type="reset">Reset</button>

    </form>

</div>
