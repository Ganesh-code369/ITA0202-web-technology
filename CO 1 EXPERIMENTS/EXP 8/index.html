<!DOCTYPE html>
<html>
<head>
    <title>Images and Links</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        .box {
            background: white;
            width: 700px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        img {
            width: 400px;
            height: 250px;
        }

        a {
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>SIMATS University</h1>

        <img src="college.jpg"
             alt="SIMATS University Campus"
             width="400"
             height="250">

        <br><br>

        <a href="https://www.simats.in/" target="_blank">
            Visit SIMATS Website
        </a>

        <br><br><br>

        <h2>External Webpage</h2>

        <iframe
            src="https://www.example.com"
            width="600"
            height="300">
        </iframe>

    </div>

</body>
</html>
